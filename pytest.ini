# M1-10 pytest 全局配置
# ---------------------------------------------------------------
# DoD：
#   ① testpaths = tests/unit tests/e2e（一次 pytest 可跑全套）
#   ② python_files = test_*.py（不收集 smoke_*.py 脚本，避免 main() 冲突）
#   ③ addopts = -q --tb=short（精简输出、失败栈只保留关键行）
#   ④ 测试文件不再各自 sys.path.insert（见 tests/conftest.py）
#
# ⚠️ 口径提醒（v5.2.7 审计确认）：
#   `tests/` 根目录还有一批 M2/M3/M4 时期的散落 `test_*.py`（约 5.4k 行），
#   它们**不被收集**——只跑 tests/unit + tests/e2e，`pytest` 也按 testpaths 走，
#   所以日常门禁碰不到它们。不要误以为 `pytest` 覆盖了全部测试：
#   - `tests/test_security_redaction.py` 已迁入 tests/unit/ 并纳入门禁；
#   - 其余散落文件为历史遗留，未被 git 追踪，**不要删除**，待人工归档决策。
#   想让它们进门禁：把文件搬进 tests/unit/ 或 tests/e2e/ 即可。
# ---------------------------------------------------------------

[pytest]
testpaths =
    tests/unit
    tests/e2e

python_files = test_*.py

addopts =
    -q
    --tb=short

# 已知的第三方模块导入时可能带出这些无关警告；静默以避免刷屏
filterwarnings =
    ignore::DeprecationWarning:matplotlib
    ignore::PendingDeprecationWarning:matplotlib
    ignore:Using or importing the ABC:DeprecationWarning
    ignore:the imp module:DeprecationWarning
    ignore:distutils Version classes:DeprecationWarning

# 排除非测试目录
norecursedirs =
    .git
    .venv
    venv
    dist
    build
    .pytest_tmp
    __pycache__
    .workbuddy
    data
