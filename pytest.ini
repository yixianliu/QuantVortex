# M1-10 pytest 全局配置
# ---------------------------------------------------------------
# DoD：
#   ① testpaths = tests/unit tests/e2e（一次 pytest 可跑全套）
#   ② python_files = test_*.py（不收集 smoke_*.py 脚本，避免 main() 冲突）
#   ③ addopts = -q --tb=short（精简输出、失败栈只保留关键行）
#   ④ 测试文件不再各自 sys.path.insert（见 tests/conftest.py）
#
# ⚠️ 口径提醒（v5.2.7 首查 / 10-06 复核修订）：
#   `tests/` 根目录还有一批 M2/M3/M4 时期的散落 `test_*.py`（25 个，约 5.4k 行），
#   它们**不被收集**——只跑 tests/unit + tests/e2e，`pytest` 也按 testpaths 走，
#   所以日常门禁碰不到它们。不要误以为 `pytest` 覆盖了全部测试：
#   - `tests/test_security_redaction.py` 已迁入 tests/unit/ 并纳入门禁；
#   - 其余 25 个散落文件：自 v5.2.7 起已随 `tests/` **入库受控**
#     （旧注记"未被 git 追踪"已过时——实测 `git ls-files` 25/25 全部追踪）。
#   ⚠️ 它们**都不是 pytest 原生**（0 个 `def test_*`），因此**不能靠"搬进 tests/unit/"
#     进门禁**：其中 18 个带模块级 `sys.exit(...)`（pytest 收集期抛 SystemExit →
#     INTERNALERROR，整批收集失败），另 7 个是模块级 `print`+`assert` 脚本（pytest
#     收集为 0 用例）。要真正进门禁须**先改写成 pytest 函数形态**，不是简单移动；
#     且 test_m2_08 等还硬编码了本机绝对路径 `D:/PythonProject/QuantVortex`。
#   历史遗留，**不要删除**；是否改写/归档由人工决策（实测：直接 `pytest tests/test_*.py`
#   当前报 INTERNALERROR，不能当门禁口径用）。
# ---------------------------------------------------------------

[pytest]
testpaths =
    tests/unit
    tests/e2e

python_files = test_*.py

addopts =
    -q
    --tb=short

# 已知的第三方模块导入时可能带出这些无关警告；静默以避免刷屏
filterwarnings =
    ignore::DeprecationWarning:matplotlib
    ignore::PendingDeprecationWarning:matplotlib
    ignore:Using or importing the ABC:DeprecationWarning
    ignore:the imp module:DeprecationWarning
    ignore:distutils Version classes:DeprecationWarning

# 排除非测试目录
norecursedirs =
    .git
    .venv
    venv
    dist
    build
    .pytest_tmp
    __pycache__
    .workbuddy
    data
